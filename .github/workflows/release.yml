name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          BIN="khotan-observer-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/khotan-observer" "$BIN"
          shasum -a 256 "$BIN" | awk '{print $1}' > "${BIN}.sha256"
          ls -lh "$BIN" "${BIN}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: khotan-observer-${{ matrix.target }}
          path: |
            khotan-observer-${{ matrix.target }}
            khotan-observer-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-out
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist-out/khotan-observer-aarch64-apple-darwin
            dist-out/khotan-observer-aarch64-apple-darwin.sha256
            dist-out/khotan-observer-x86_64-apple-darwin
            dist-out/khotan-observer-x86_64-apple-darwin.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
